session_eintragen:
  fields:
    datum:
      required: true
      selector:
        date:
    beginn:
      selector:
        time:
    ende:
      selector:
        time:
    art:
      default: casino
      selector:
        select:
          options: [casino, home_game, online, sonstiges]
          translation_key: art
    spielart:
      default: cash
      selector:
        select:
          options: [cash, turnier]
          translation_key: spielart
    blinds:
      example: "1/2"
      selector:
        text:
    ort:
      selector:
        text:
    einsatz:
      required: true
      selector:
        number:
          min: 0
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    gewinn:
      required: true
      selector:
        number:
          min: -100000
          max: 100000
          step: 0.01
          mode: box
          unit_of_measurement: "€"
    notiz:
      selector:
        text:

